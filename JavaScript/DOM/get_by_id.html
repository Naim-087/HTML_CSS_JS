<!DOCTYPE html>
<html>
<head>
    <title>DOM Selector Example</title>
</head>
<body>

    <h1 id="title">Hello</h1>

    <script>
        // Select element by ID
        let element = document.getElementById("title");

       

        // Change the text
        element.innerHTML = "Welcome to JavaScript";

         // Display in browser console
        console.log(element);
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<body>

    <button id="btn">Change Background</button>

    <script>
        let btn = document.getElementById("btn");

        btn.addEventListener("click", function() {
            document.body.style.backgroundColor = "gray";
            btn.style.color ="green";
            btn.innerText = "Click to change";
        });
    </script>

</body>
</html>

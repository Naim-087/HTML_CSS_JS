<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Click Example</title>
</head>
<body>
    <h1>On Double Click Event</h1>
    <p id="para">Double‑click the button to change colors</p>
    <button id="btn">Double Click Me</button>

    <script>
        let button = document.getElementById("btn");

        button.addEventListener("dblclick", function() {
            // Change background of the whole page
            document.body.style.backgroundColor = "lightblue";

            // Change background of the paragraph only
            document.getElementById("para").style.backgroundColor = "green";
        });
    </script>
</body>
</html>

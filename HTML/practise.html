<!DOCTYPE html>
<html>
<head>
    <title>Matrix Fan Registration</title>

    <style>
        /* I. Dark background and light text */
        body{
            background-color: black;
            color: red;
            font-family: Arial;
        }

        /* II. Favorite Quote input with glowing green border */
        #highlight{
            border: 2px solid lime;
            box-shadow: 0px 0px 10px lime;
        }

        /* III. Created by text light blue and italic */
        .creator{
            color: lightblue;
            font-style: italic;
        }

        /* IV. Hover effect on submit button */
        button:hover{
            background-color: lime;
            color: black;
        }

        /* V. First letter of heading larger and neon green */
        h2::first-letter{
            font-size: 200%;
            color: #39FF14; /* Neon green */
        }
    </style>
</head>

<body>

    <h2>The Matrix Fan Registration</h2>

    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br><br>

        <label for="quote">Favorite Quote:</label>
        <input type="text" id="highlight" name="quote">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <button type="submit">
            Enter the Matrix
        </button>

    </form>

    <p class="creator">
        Created by The Wachovskis
    </p>

</body>
</html>

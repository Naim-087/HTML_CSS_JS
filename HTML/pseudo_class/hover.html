<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-class</title>
    <style>
        button:hover{
            background-color: green;
        }
        input{
            padding : 10px;
            width: 150px;
        }
        input:hover{
            background-color:rgba(104, 137, 85, 0.767);
        }
        
    </style>
</head>
<div>
    <br>
    
    <label>Full Name : </label>
    <input type="text" placeholder="Enter your name">
    <br>
    <label>Date of birth : </label>
    <input type="date" min="01-01-1980" max="01-01-2018" placeholder="Enter DOB">
    <br>
    <button><b><i>Submit</i></b></button>
    <br>
    
</div>
</html>

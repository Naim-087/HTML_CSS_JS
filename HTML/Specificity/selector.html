<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector</title>
    <style>
        p1{
            color: blue;
        }

        .paragraph{
            color:red;
        }

        #text{
            color:green;
        }

    </style>
</head>
<body>
    <p1 id="text" class="Paragraph">
        <b>Hello Mr. Naimul Islam </b>
    </p1>
    <br>
    <p2>Text color will be green because "id" selector has higher specificity </p2>
    
</body>
</html>

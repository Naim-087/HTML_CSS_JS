<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================
            BASIC META
    =========================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- ==========================
            SEO
    =========================== -->

    <meta name="description"
          content="Manage your MediReminder profile">

    <meta name="author"
          content="Naim Islam">

    <!-- ==========================
            TITLE
    =========================== -->

    <title>MediReminder | Profile</title>

    <!-- ==========================
            CSS
    =========================== -->

    <link rel="stylesheet"
          href="../assets/css/style.css">

    <!-- ==========================
            FAVICON
    =========================== -->

    <link rel="icon"
          href="../assets/icons/favicon.ico">

</head>

<body>

    <!-- ==========================
            HEADER
    =========================== -->

    <header class="header">

        <div class="logo">

            <h1>MediReminder</h1>

        </div>

        <nav class="navigation">

            <ul class="navigation__list">

                <li><a href="dashboard.html">Dashboard</a></li>

                <li><a href="add-medicine.html">Add Medicine</a></li>

                <li><a href="medicines.html">Medicines</a></li>

                <li><a href="history.html">History</a></li>

                <li><a href="profile.html">Profile</a></li>

            </ul>

        </nav>

    </header>



    <!-- ==========================
            MAIN
    =========================== -->

    <main>

        <!-- ==========================
                PROFILE HEADER
        =========================== -->

        <section class="profile-header">

            <h2>

                My Profile

            </h2>

            <p>

                View your account information.

            </p>

        </section>



        <!-- ==========================
                PROFILE CARD
        =========================== -->

        <section class="profile-section">

            <div class="profile-card">

                <h3>

                    User Information

                </h3>

                <hr>

                <div class="profile-item">

                    <span class="profile-label">

                        Full Name

                    </span>

                    <span
                        id="profile-name"
                        class="profile-value">

                    </span>

                </div>



                <div class="profile-item">

                    <span class="profile-label">

                        Email

                    </span>

                    <span
                        id="profile-email"
                        class="profile-value">

                    </span>

                </div>



                <div class="profile-item">

                    <span class="profile-label">

                        Phone

                    </span>

                    <span
                        id="profile-phone"
                        class="profile-value">

                    </span>

                </div>



                <div class="profile-item">

                    <span class="profile-label">

                        Age

                    </span>

                    <span
                        id="profile-age"
                        class="profile-value">

                    </span>

                </div>



                <div class="profile-item">

                    <span class="profile-label">

                        Gender

                    </span>

                    <span
                        id="profile-gender"
                        class="profile-value">

                    </span>

                </div>



                <div class="profile-item">

                    <span class="profile-label">

                        Member Since

                    </span>

                    <span
                        id="profile-created"
                        class="profile-value">

                    </span>

                </div>

            </div>

        </section>

    </main>



    <!-- ==========================
            FOOTER
    =========================== -->

    <footer class="footer">

        <p>

            © 2026 MediReminder

        </p>

        <p>

            Academic Project | Department of Software Engineering

        </p>

    </footer>



    <!-- ==========================
            JAVASCRIPT
    =========================== -->

    <script src="../assets/js/profile.js"></script>

</body>

</html>

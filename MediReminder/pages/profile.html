<body>

        <div class="logo">

            <h1>MediReminder</h1>

        </div>

        <nav class="navigation">

            <ul class="navigation__list">

                <li><a href="dashboard.html">Dashboard</a></li>

                <li><a href="profile.html">Profile</a></li>

            </ul>

        </nav>

    </header>



    

    <main>

        <section class="profile">

            <h2>My Profile</h2>

            <p>

                View and update your personal information.

            </p>

            <form action="#" method="post">

                

                <fieldset>

                    <legend>Personal Information</legend>

                    <div class="form-group">

                        <label for="fullname">

                            Full Name

                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="email">

                            Email Address

                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="phone">

                            Phone Number

                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="age">

                            Age

                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            min="1"
                            max="120"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="gender">

                            Gender

                        </label>

                        <select
                            id="gender"
                            name="gender">

                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>

                        </select>

                    </div>

                </fieldset>



                <!-- 
                        Security
                -->

                <fieldset>

                    <legend>Security</legend>

                    <div class="form-group">

                        <label for="new-password">

                            New Password

                        </label>

                        <input
                            type="password"
                            id="new-password"
                            name="new-password"
                            placeholder="Leave blank to keep current password">

                    </div>

                    <div class="form-group">

                        <label for="confirm-password">

                            Confirm Password

                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm new password">

                    </div>

                </fieldset>



                <button type="submit">

                    Save Changes

                </button>

            </form>

        </section>

    </main>

</body>

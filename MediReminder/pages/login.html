<!DOCTYPE html>
<html lang="en">

<head>

   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="Login to MediReminder">
    <meta name="author" content="Naim Islam">

    
    <title>MediReminder | Login</title>

    
    <link rel="stylesheet" href="../assets/css/style.css">

    
    <link rel="icon" href="../assets/icons/favicon.ico">

</head>

<body>

    

    <header class="header">

        <div class="logo">

            <h1>MediReminder</h1>

        </div>

        <nav class="navigation">

            <ul class="navigation__list">

                <li><a href="index.html">Home</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="signup.html">Sign Up</a></li>

            </ul>

        </nav>

    </header>



    

    <main>

        <section class="login">

            <h2>Welcome Back</h2>

            <p>

                Login to access your medicine reminders and dashboard.

            </p>

            <form action="#" method="post">

                <fieldset>

                    <legend>Login Information</legend>

                    <div class="form-group">

                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>

                    </div>

                </fieldset>

                <button type="submit">

                    Login

                </button>

            </form>

            <p>

                Don't have an account?

                <a href="signup.html">Create Account</a>

            </p>

        </section>

    </main>



   

    <footer class="footer">

        <p>© 2026 MediReminder</p>

        <p>Academic Project | Department of Software Engineering</p>

    </footer>

</body>

</html>

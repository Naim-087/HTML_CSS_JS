<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic Meta Information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="Create your MediReminder account">
    <meta name="author" content="Naim Islam">

    <!-- Title -->
    <title>MediReminder | Sign Up</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Favicon -->
    <link rel="icon" href="../assets/icons/favicon.ico">

</head>

<body>

    <!-- ==========================
            HEADER
    =========================== -->

    <header class="header">

        <div class="logo">

            <h1>MediReminder</h1>

        </div>

        <nav class="navigation">

            <ul class="navigation__list">

                <li><a href="index.html">Home</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="login.html">Login</a></li>

            </ul>

        </nav>

    </header>



    <!-- ==========================
            MAIN CONTENT
    =========================== -->

    <main>

        <section class="signup">

            <h2>Create Your Account</h2>

            <p>

                Fill in the information below to create your MediReminder account.

            </p>



            <form id="signup-form" novalidate>

                <!-- ==========================
                        Personal Information
                =========================== -->

                <fieldset>

                    <legend>Personal Information</legend>



                    <div class="form-group">

                        <label for="full-name">

                            Full Name

                        </label>

                        <input
                            type="text"
                            id="full-name"
                            name="full-name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                        <small class="error-message"></small>

                    </div>



                    <div class="form-group">

                        <label for="email">

                            Email Address

                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                        <small class="error-message"></small>

                    </div>



                    <div class="form-group">

                        <label for="phone">

                            Phone Number

                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            maxlength="15"
                            required>

                        <small class="error-message"></small>

                    </div>



                    <div class="form-group">

                        <label for="age">

                            Age

                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Enter your age"
                            min="1"
                            max="120"
                            required>

                        <small class="error-message"></small>

                    </div>



                    <div class="form-group">

                        <label for="gender">

                            Gender

                        </label>

                        <select
                            id="gender"
                            name="gender"
                            required>

                            <option value="">Select Gender</option>

                            <option value="Male">Male</option>

                            <option value="Female">Female</option>

                            <option value="Other">Other</option>

                        </select>

                        <small class="error-message"></small>

                    </div>

                </fieldset>



                <!-- ==========================
                        Account Information
                =========================== -->

                <fieldset>

                    <legend>Account Information</legend>



                    <div class="form-group">

                        <label for="password">

                            Password

                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required>

                        <small class="error-message"></small>

                    </div>



                    <div class="form-group">

                        <label for="confirm-password">

                            Confirm Password

                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="8"
                            required>

                        <small class="error-message"></small>

                    </div>

                </fieldset>



                <!-- ==========================
                        Terms & Conditions
                =========================== -->

                <div class="form-group checkbox-group">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required>

                        I agree to the Terms and Conditions.

                    </label>

                    <small class="error-message"></small>

                </div>



                <!-- ==========================
                        Submit Button
                =========================== -->

                <button
                    id="signup-btn"
                    type="submit">

                    Create Account

                </button>

            </form>



            <p class="login-link">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </section>

    </main>



    <!-- ==========================
            FOOTER
    =========================== -->

    <footer class="footer">

        <p>

            © 2026 MediReminder

        </p>

        <p>

            Academic Project | Department of Software Engineering

        </p>

    </footer>



    <!-- ==========================
            JAVASCRIPT
    =========================== -->

    <script src="../assets/js/auth.js" defer></script>

</body>

</html>

    <!--  MAIN CONTENT -->

    <main>

       <section class="form-page add-medicine">

            <h2>Add New Medicine</h2>

            <p>

                Enter your medicine information to schedule a reminder.

            </p>



            <!-- ==========================
                    MEDICINE FORM
            =========================== -->

            <form id="medicine-form" novalidate>

                <!-- ==========================
                        Medicine Information
                =========================== -->

                <fieldset>

                    <legend>Medicine Information</legend>



                    <div class="form-group">

                        <label for="medicine-name">

                            Medicine Name

                        </label>

                        <input
                            type="text"
                            id="medicine-name"
                            name="medicine-name"
                            placeholder="Enter medicine name"
                            required>

                    </div>



                    <div class="form-group">

                        <label for="dosage">

                            Dosage

                        </label>

                        <input
                            type="text"
                            id="dosage"
                            name="dosage"
                            placeholder="Example: 500 mg"
                            required>

                    </div>



                    <div class="form-group">

                        <label for="medicine-type">

                            Medicine Type

                        </label>

                        <select
                            id="medicine-type"
                            name="medicine-type"
                            required>

                            <option value="">Select Medicine Type</option>

                            <option value="Tablet">Tablet</option>

                            <option value="Capsule">Capsule</option>

                            <option value="Syrup">Syrup</option>

                            <option value="Injection">Injection</option>

                            <option value="Drops">Drops</option>

                            <option value="Other">Other</option>

                        </select>

                    </div>

                </fieldset>



                <!-- ==========================
                        Reminder Information
                =========================== -->

                <fieldset>

                    <legend>Reminder Information</legend>



                    <div class="form-group">

                        <label for="start-date">

                            Start Date

                        </label>

                        <input
                            type="date"
                            id="start-date"
                            name="start-date"
                            required>

                    </div>



                    <div class="form-group">

                        <label for="end-date">

                            End Date

                        </label>

                        <input
                            type="date"
                            id="end-date"
                            name="end-date"
                            required>

                    </div>



                    <div class="form-group">

                        <label for="time">

                            Reminder Time

                        </label>

                        <input
                            type="time"
                            id="time"
                            name="time"
                            required>

                    </div>



                    <div class="form-group">

                        <label for="frequency">

                            Frequency

                        </label>

                        <select
                            id="frequency"
                            name="frequency"
                            required>

                            <option value="">Select Frequency</option>

                            <option value="Daily">Daily</option>

                            <option value="Weekly">Weekly</option>

                        </select>

                    </div>

                </fieldset>



                <!-- Additional Notes-->

                <fieldset>

                    <legend>Additional Notes</legend>



                    <div class="form-group">

                        <label for="notes">

                            Notes

                        </label>

                        <textarea
                            id="notes"
                            name="notes"
                            rows="5"
                            placeholder="Write additional instructions (Optional)"></textarea>

                    </div>

                </fieldset>



                <!--   BUTTONS   -->

                <div class="form-buttons">

                    <button
                        id="save-medicine-btn"
                        type="submit">

                        Save Medicine

                    </button>



                    <button
                        id="reset-btn"
                        type="reset">

                        Reset

                    </button>

                </div>

            </form>

        </section>

    </main>

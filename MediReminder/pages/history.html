<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic Meta Information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="Medicine History - MediReminder">
    <meta name="author" content="Naim Islam">

    <!-- Title -->
    <title>MediReminder | History</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Favicon -->
    <link rel="icon" href="../assets/icons/favicon.ico">

</head>

<body>

    <!-- ==========================
            HEADER
    =========================== -->

    <header class="header">

        <div class="logo">

            <h1>MediReminder</h1>

        </div>

        <nav class="navigation">

            <ul class="navigation__list">

                <li><a href="dashboard.html">Dashboard</a></li>

                <li><a href="add-medicine.html">Add Medicine</a></li>

                <li><a href="medicines.html">Medicines</a></li>

                <li><a href="history.html">History</a></li>

                <li><a href="profile.html">Profile</a></li>

            </ul>

        </nav>

    </header>



    <!-- ==========================
            MAIN CONTENT
    =========================== -->

    <main>

        <!-- Page Header -->

        <section class="history-header">

            <h2>Medicine History</h2>

            <p>

                View your completed and missed medicine records.

            </p>

        </section>



        <!-- Search & Filter -->

        <section class="history-controls">

            <div class="form-group">

                <label for="search-history">

                    Search Medicine

                </label>

                <input
                    type="search"
                    id="search-history"
                    name="search-history"
                    placeholder="Search medicine">

            </div>

            <div class="form-group">

                <label for="history-status">

                    Status

                </label>

                <select
                    id="history-status"
                    name="history-status">

                    <option value="">All</option>
                    <option>Taken</option>
                    <option>Missed</option>

                </select>

            </div>

        </section>



        <!-- History List -->

        <section class="history-list">

            <p class="empty-state">

                No medicine history available.

            </p>

            <!--
                JavaScript will generate history cards here.

                Example:

                <article class="card history-card">

                    <h3>Paracetamol</h3>

                    <p>Status : Taken</p>

                    <p>Date : 30 July 2026</p>

                    <p>Time : 8:00 AM</p>

                </article>

            -->

        </section>

    </main>



    <!-- ==========================
            FOOTER
    =========================== -->

    <footer class="footer">

        <p>

            © 2026 MediReminder

        </p>

        <p>

            Academic Project | Department of Software Engineering

        </p>

    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic Meta Information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="View and manage medicines">
    <meta name="author" content="Naim Islam">

    <!-- Title -->
    <title>MediReminder | Medicines</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Favicon -->
    <link rel="icon" href="../assets/icons/favicon.ico">

</head>

<body>

    <!-- ==========================
            HEADER
    =========================== -->

    <header class="header">

        <div class="logo">

            <h1>MediReminder</h1>

        </div>

        <nav class="navigation">

            <ul class="navigation__list">

                <li><a href="dashboard.html">Dashboard</a></li>

                <li><a href="add-medicine.html">Add Medicine</a></li>

                <li><a href="medicines.html">Medicines</a></li>

                <li><a href="history.html">History</a></li>

                <li><a href="profile.html">Profile</a></li>

            </ul>

        </nav>

    </header>



    <!-- ==========================
            MAIN CONTENT
    =========================== -->

    <main>

        <!-- Page Heading -->

        <section class="medicine-header">

            <h2>My Medicines</h2>

            <p>

                View, search and manage all of your medicines.

            </p>

        </section>



        <!-- Search & Filter -->

        <section class="medicine-controls">

            <div class="form-group">

                <label for="search-medicine">

                    Search Medicine

                </label>

                <input
                    type="search"
                    id="search-medicine"
                    name="search-medicine"
                    placeholder="Search by medicine name">

            </div>



            <div class="form-group">

                <label for="filter-type">

                    Medicine Type

                </label>

                <select
                    id="filter-type"
                    name="filter-type">

                    <option value="">All Types</option>
                    <option>Tablet</option>
                    <option>Capsule</option>
                    <option>Syrup</option>
                    <option>Injection</option>
                    <option>Drops</option>
                    <option>Other</option>

                </select>

            </div>

        </section>



        <!-- Medicine List -->

        <section class="medicine-list">

            <!-- ===================================
                    Medicine Card Template
                 JavaScript will generate cards here.
            ==================================== -->

            <!-- Example

            <article class="card medicine-card">

                <h3>Paracetamol</h3>

                <p>Tablet</p>

                <p>500 mg</p>

                <p>8:00 AM</p>

                <button>Edit</button>

                <button>Delete</button>

            </article>

            -->

        </section>

    </main>



    <!-- ==========================
            FOOTER
    =========================== -->

    <footer class="footer">

        <p>

            © 2026 MediReminder

        </p>

        <p>

            Academic Project | Department of Software Engineering

        </p>

    </footer>

</body>

</html>

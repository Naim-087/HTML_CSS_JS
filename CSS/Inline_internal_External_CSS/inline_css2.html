<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Example</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0;">

    <!-- Header -->
    <div style="background-color: #2c3e50; color: white; padding: 20px; text-align: center;">
        <h1 style="margin: 0;">My Portfolio</h1>
        <p style="margin: 5px;">Welcome to my personal website</p>
    </div>

    <!-- Navigation -->
    <div style="background-color: #34495e; padding: 10px; text-align: center;">
        <a href="#" style="color: white; text-decoration: none; margin: 15px;">Home</a>
        <a href="#" style="color: white; text-decoration: none; margin: 15px;">About</a>
        <a href="#" style="color: white; text-decoration: none; margin: 15px;">Projects</a>
        <a href="#" style="color: white; text-decoration: none; margin: 15px;">Contact</a>
    </div>

    <!-- Main Content -->
    <div style="padding: 20px; text-align: center;">

        <h2 style="color: darkblue;">About Me</h2>

        <img src="https://via.placeholder.com/200"
             alt="Profile Picture"
             style="border-radius: 50%; border: 4px solid blue;">

        <p style="font-size: 18px; color: #333;">
            Hello! My name is <b>Naim</b>. I am a Software Engineering student
            learning HTML, CSS, and JavaScript. I want to become an AI Software Engineer.
        </p>

        <button style="background-color: green; color: white; padding: 10px 20px; border: none; border-radius: 5px;">
            Learn More
        </button>

    </div>

    <!-- Footer -->
    <div style="background-color: #2c3e50; color: white; text-align: center; padding: 15px;">
        © 2026 My Portfolio | All Rights Reserved
    </div>

</body>
</html>
